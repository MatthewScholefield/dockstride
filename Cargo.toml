[package]
name = "dockstride"
version = "0.2.1"
edition = "2024"
description = "Transparent Docker development and Swarm deployment"
license = "MIT"

[[bin]]
name = "dks"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
comfy-table = "7"
console = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
nickel-lang-core = { version = "=0.19.0", default-features = false }
fs2 = "0.4"
getrandom = "0.3"
libc = "0.2"
sha2 = "0.10"
hex = "0.4"
signal-hook = "0.3"
rpassword = "7"
ureq = { version = "3", default-features = false, features = ["rustls"] }
shell-words = "1"

tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[patch.crates-io]
nickel-lang-core = { path = "vendor/nickel-lang-core" }
